<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80">
  <defs>
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E2E8F0"/>
      <stop offset="55%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#8892B0"/>
    </linearGradient>
    <filter id="crimson-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#8B0000"/>
      <feDropShadow dx="5" dy="6" stdDeviation="1" flood-color="#E62429"/>
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="476" height="76" fill="#0A0B10" stroke="#FFFFFF" stroke-width="2.5" rx="2"/>
  <rect x="6" y="6" width="468" height="68" fill="none" stroke="#E62429" stroke-width="2" rx="1"/>
  <text x="240" y="60" text-anchor="middle"
        font-family="'Anton', 'Oswald', sans-serif" font-size="62" font-weight="900"
        letter-spacing="2" fill="url(#silver-grad)" stroke="#FFFFFF" stroke-width="0.8"
        filter="url(#crimson-shadow)">WHAT IF...?</text>
</svg>
